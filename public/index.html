<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCuaderno - Voz a Texto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 0.9rem;
        }

        .mic-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            width: 120px;
            height: 120px;
            border-radius: 60px;
            cursor: pointer;
            margin: 20px auto;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-button:hover {
            transform: scale(1.05);
        }

        .mic-button.recording {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .mic-icon {
            font-size: 48px;
            color: white;
        }

        .status {
            margin: 20px 0;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 20px;
            background: #f0f0f0;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 24px;
            margin-top: 20px;
            text-align: left;
            border-left: 4px solid #667eea;
        }

        .result-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #999;
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 1.2rem;
            line-height: 1.5;
            color: #333;
            word-wrap: break-word;
            min-height: 60px;
        }

        .placeholder {
            color: #bbb;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .edit-area {
            margin-top: 20px;
            width: 100%;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .hidden {
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 0.85rem;
            animation: fadeOut 3s ease forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎙️ MiCuaderno</h1>
        <div class="subtitle">Habla y la app registra tu venta</div>

        <div class="mic-button" id="micButton">
            <div class="mic-icon">🎤</div>
        </div>

        <div class="status" id="status">🔴 Desconectado</div>

        <div class="result" id="result">
            <div class="result-label">📝 TRANSCRIPCIÓN</div>
            <div class="result-text placeholder" id="transcript">Presiona el micrófono y empieza a hablar...</div>
        </div>

        <!-- Área de edición (oculta al inicio) -->
        <div class="edit-area hidden" id="editArea">
            <textarea id="editTextarea" rows="3" placeholder="Corrige el texto aquí..."></textarea>
        </div>

        <div class="button-group">
            <button id="clearBtn" class="btn-secondary">🗑️ Limpiar</button>
            <button id="editBtn" class="btn-warning">✏️ Editar</button>
            <button id="saveEditBtn" class="btn-success hidden">💾 Guardar cambios</button>
            <button id="cancelEditBtn" class="btn-secondary hidden">❌ Cancelar</button>
        </div>

        <div id="messageArea"></div>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURACIÓN - REEMPLAZA TU API KEY AQUÍ
        // ============================================================
        const DEEPGRAM_API_KEY = '5d522463b9d666c6578064a303f5f0398c9fe568';  // ⚠️ REEMPLAZA ESTO

        // ============================================================
        // 2. ELEMENTOS DEL DOM
        // ============================================================
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const clearBtn = document.getElementById('clearBtn');
        const editBtn = document.getElementById('editBtn');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editArea = document.getElementById('editArea');
        const editTextarea = document.getElementById('editTextarea');
        const messageArea = document.getElementById('messageArea');

        // ============================================================
        // 3. VARIABLES DE ESTADO
        // ============================================================
        let mediaRecorder = null;
        let socket = null;
        let isRecording = false;
        let stream = null;
        let isEditMode = false;

        // ============================================================
        // 4. FUNCIONES DE UTILIDAD
        // ============================================================
        function showMessage(text, type = 'success') {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'success-message';
            messageDiv.style.background = type === 'success' ? '#d4edda' : '#f8d7da';
            messageDiv.style.color = type === 'success' ? '#155724' : '#721c24';
            messageDiv.textContent = text;
            messageArea.appendChild(messageDiv);

            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        function enterEditMode() {
            const currentText = transcriptDiv.textContent;
            if (currentText === 'Presiona el micrófono y empieza a hablar...' || currentText === '') {
                showMessage('No hay texto para editar', 'error');
                return;
            }

            isEditMode = true;
            editTextarea.value = currentText;
            editArea.classList.remove('hidden');
            editBtn.classList.add('hidden');
            saveEditBtn.classList.remove('hidden');
            cancelEditBtn.classList.remove('hidden');
            transcriptDiv.classList.add('hidden');
        }

        function exitEditMode(save = false) {
            if (save && editTextarea.value.trim() !== '') {
                transcriptDiv.textContent = editTextarea.value.trim();
                transcriptDiv.classList.remove('placeholder');
                showMessage('✅ Texto guardado correctamente');
            }

            isEditMode = false;
            editArea.classList.add('hidden');
            editBtn.classList.remove('hidden');
            saveEditBtn.classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
            transcriptDiv.classList.remove('hidden');
        }

        function clearTranscript() {
            transcriptDiv.textContent = '';
            transcriptDiv.classList.remove('placeholder');
            showMessage('🧹 Texto limpiado');

            if (isEditMode) {
                exitEditMode(false);
            }
        }

        // ============================================================
        // 5. CONEXIÓN A DEEPGRAM (WEBSOCKET)
        // ============================================================
        function connectDeepgram() {
            const deepgramUrl = 'wss://api.deepgram.com/v1/listen?model=nova-2&language=es&interim_results=true&smart_format=true&punctuate=true';

            socket = new WebSocket(deepgramUrl, ['token', DEEPGRAM_API_KEY]);

            socket.onopen = () => {
                console.log('✅ WebSocket conectado a Deepgram');
                statusDiv.textContent = '🟢 Conectado - Puedes empezar a hablar';
                statusDiv.classList.add('connected');
                statusDiv.classList.remove('error');
                startRecording();
            };

            socket.onmessage = (message) => {
                try {
                    const data = JSON.parse(message.data);
                    const transcript = data.channel?.alternatives[0]?.transcript;

                    if (transcript && transcript.trim() !== '') {
                        if (data.is_final) {
                            // Resultado final - agregar al texto existente
                            const currentText = transcriptDiv.textContent;
                            const isPlaceholder = transcriptDiv.classList.contains('placeholder');

                            if (isPlaceholder) {
                                transcriptDiv.textContent = transcript;
                                transcriptDiv.classList.remove('placeholder');
                            } else {
                                transcriptDiv.textContent = currentText ? currentText + ' ' + transcript : transcript;
                            }
                            statusDiv.textContent = '🟢 Conectado - Escuchando';
                        } else {
                            // Resultado provisional
                            statusDiv.textContent = '🎙️ Escuchando... ' + transcript;
                        }
                    }
                } catch (e) {
                    console.error('Error parseando mensaje:', e);
                }
            };

            socket.onerror = (error) => {
                console.error('❌ Error WebSocket:', error);
                statusDiv.textContent = '❌ Error de conexión con Deepgram';
                statusDiv.classList.remove('connected');
                statusDiv.classList.add('error');
            };

            socket.onclose = () => {
                console.log('🔌 WebSocket cerrado');
                if (isRecording) {
                    statusDiv.textContent = '⚠️ Desconectado - Reintentando...';
                    statusDiv.classList.remove('connected');
                    setTimeout(connectDeepgram, 2000);
                }
            };
        }

        // ============================================================
        // 6. GRABACIÓN DE MICRÓFONO
        // ============================================================
        async function startRecording() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm'
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(event.data);
                    }
                };

                mediaRecorder.start(250);
                isRecording = true;
                micButton.classList.add('recording');
                console.log('🎙️ Grabando...');

            } catch (error) {
                console.error('Error al acceder al micrófono:', error);
                statusDiv.textContent = '❌ Error: Permiso de micrófono denegado';
                statusDiv.classList.add('error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            isRecording = false;
            micButton.classList.remove('recording');
            statusDiv.textContent = '🔴 Desconectado';
            statusDiv.classList.remove('connected');
            statusDiv.classList.remove('error');
        }

        // ============================================================
        // 7. EVENT LISTENERS
        // ============================================================
        micButton.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                connectDeepgram();
            }
        });

        clearBtn.addEventListener('click', clearTranscript);
        editBtn.addEventListener('click', enterEditMode);
        saveEditBtn.addEventListener('click', () => exitEditMode(true));
        cancelEditBtn.addEventListener('click', () => exitEditMode(false));

        // ============================================================
        // 8. INICIALIZACIÓN
        // ============================================================
        console.log('🚀 App lista. Haz clic en el micrófono para empezar');

        if (DEEPGRAM_API_KEY === 'TU_API_KEY_AQUI') {
            console.warn('⚠️ Recuerda reemplazar TU_API_KEY_AQUI con tu API key de Deepgram');
            statusDiv.textContent = '⚠️ Configura tu API Key de Deepgram';
            statusDiv.classList.add('error');
        }
    </script>
</body>

</html>
